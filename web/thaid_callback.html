<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ยืนยันตัวตนด้วย ThaID</title>
  <style>
    body { font-family: sans-serif; padding: 24px; color: #1b2430; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
  </style>
</head>
<body>
  <!--
    หน้าปลายทางหลังยืนยันตัวตนด้วย ThaID
    backend พาผู้ใช้มาที่นี่พร้อม #state=... (และ &error=... ถ้าไม่สำเร็จ) ไม่มีเลขบัตรใน URL
    หน้านี้ส่ง state กลับไปให้หน้าจองที่เปิดหน้าต่างนี้ (window.opener) แล้วปิดตัวเอง
    หน้าจองจะเทียบ state กับค่าที่ส่งไปตอนเริ่ม ต้องตรงกันจึงจะขอผล
    ส่งเฉพาะ origin เดียวกันเท่านั้น ข้อความจึงไม่หลุดไปเว็บอื่น
  -->
  <p id="msg">กำลังส่งผลยืนยันตัวตนกลับไปที่หน้าจอง...</p>
  <script>
    (function () {
      var params = new URLSearchParams(location.hash.substring(1));
      var state = params.get('state');
      var error = params.get('error');
      history.replaceState(null, '', location.pathname);
      var msg = document.getElementById('msg');
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'thaid', state: state, error: error }, location.origin);
        msg.textContent = error ? error : 'ยืนยันตัวตนเรียบร้อย ปิดหน้าต่างนี้ได้';
        msg.className = error ? 'err' : 'ok';
        setTimeout(function () { window.close(); }, error ? 3000 : 500);
      } else {
        msg.textContent = error ? error
          : 'ยืนยันตัวตนเรียบร้อย แต่ไม่พบหน้าจองที่เปิดหน้าต่างนี้ กรุณากลับไปที่หน้าจองแล้วกดยืนยันตัวตนใหม่';
        msg.className = error ? 'err' : 'ok';
      }
    })();
  </script>
</body>
</html>
