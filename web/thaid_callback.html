<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ยืนยันตัวตนด้วย ThaID</title>
  <style>
    body { font-family: sans-serif; padding: 24px; color: #1b2430; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
  </style>
</head>
<body>
  <!--
    หน้าปลายทางหลังยืนยันตัวตนด้วย ThaID
    backend พาผู้ใช้มาที่นี่พร้อม #state=... (และ &error=... ถ้าไม่สำเร็จ) ไม่มีเลขบัตรใน URL
    หน้านี้ส่ง state กลับไปให้หน้าจองที่เปิดหน้าต่างนี้ (window.opener) แล้วปิดตัวเอง
    หน้าจองจะเทียบ state กับค่าที่ส่งไปตอนเริ่ม ต้องตรงกันจึงจะขอผล
    มือถือ: แอป ThaID เปิดหน้านี้ในแท็บใหม่ที่ไม่มี window.opener — หน้าเว็บแท็บเดิมถามสถานะจาก backend เอง
    (POST /api/auth/public-thaid/status) หน้านี้แค่บอกให้ผู้ใช้กลับไปที่แท็บเดิม (ไม่ส่ง state ไปที่อื่น)
    ส่งเฉพาะ origin เดียวกันเท่านั้น ข้อความจึงไม่หลุดไปเว็บอื่น
  -->
  <p id="msg">กำลังส่งผลยืนยันตัวตนกลับไปที่หน้าเว็บของระบบ...</p>
  <script>
    (function () {
      var params = new URLSearchParams(location.hash.substring(1));
      var state = params.get('state');
      var error = params.get('error');
      // ผู้ใช้กดยกเลิกในแอป ThaID (รหัส user_denied) backend ส่ง cancelled=1 มาแทน error
      var cancelled = params.get('cancelled') === '1';
      history.replaceState(null, '', location.pathname);
      var msg = document.getElementById('msg');
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: 'thaid', state: state, error: error, cancelled: cancelled }, location.origin);
        msg.textContent = cancelled ? 'ผู้ใช้งานยกเลิกการใช้ ThaID'
          : error ? error : 'ยืนยันตัวตนเรียบร้อย ปิดหน้าต่างนี้ได้';
        msg.className = error ? 'err' : 'ok';
        setTimeout(function () { window.close(); }, error ? 3000 : 500);
      } else {
        // ไม่มีหน้าต่างต้นทาง: มือถือที่แอป ThaID เปิดหน้านี้ในแท็บใหม่ (หรือเบราว์เซอร์อื่น)
        // หน้าเว็บแท็บเดิมถามสถานะจาก backend เอง ผู้ใช้แค่สลับกลับไป
        msg.textContent = cancelled
          ? 'ผู้ใช้งานยกเลิกการใช้ ThaID กลับไปที่หน้าเว็บระบบจองห้องอบรมที่เปิดค้างไว้ได้เลย'
          : error ? error + ' (กลับไปที่หน้าเว็บระบบจองห้องอบรมที่เปิดค้างไว้แล้วลองใหม่)'
          : 'ยืนยันตัวตนเรียบร้อย กรุณากลับไปที่หน้าเว็บระบบจองห้องอบรมที่เปิดค้างไว้ (แท็บเดิม) ' +
            'ระบบจะทำรายการต่อให้เอง แล้วปิดหน้านี้ได้';
        msg.className = error ? 'err' : 'ok';
        // ปิดตัวเองได้เฉพาะเบราว์เซอร์ที่ยอม (แท็บที่สคริปต์เปิด) ไม่ได้ก็ยังแสดงข้อความ
        setTimeout(function () { try { window.close(); } catch (e) {} }, 4000);
      }
    })();
  </script>
</body>
</html>
